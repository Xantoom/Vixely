<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Vixely — Free Online Video, Image &amp; GIF Editor">
	<defs>
		<linearGradient id="og-icon-grad" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#a78bfa"/>
			<stop offset="100%" stop-color="#7c3aed"/>
		</linearGradient>
		<mask id="og-cut">
			<rect width="64" height="64" fill="white"/>
			<path d="M15 16 L32 50 L49 16 Z" fill="black"/>
		</mask>
		<radialGradient id="og-bg-1" cx="0.2" cy="0.2" r="0.5">
			<stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18"/>
			<stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="og-bg-2" cx="0.85" cy="0.3" r="0.45">
			<stop offset="0%" stop-color="#60a5fa" stop-opacity="0.14"/>
			<stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
		</radialGradient>
		<radialGradient id="og-bg-3" cx="0.5" cy="0.95" r="0.4">
			<stop offset="0%" stop-color="#34d399" stop-opacity="0.1"/>
			<stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
		</radialGradient>
		<pattern id="og-grid" width="60" height="60" patternUnits="userSpaceOnUse">
			<path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1c1c1f" stroke-width="1"/>
		</pattern>
		<linearGradient id="og-grid-mask" x1="0.5" y1="0" x2="0.5" y2="1">
			<stop offset="0%" stop-color="white" stop-opacity="0.5"/>
			<stop offset="100%" stop-color="white" stop-opacity="0"/>
		</linearGradient>
		<mask id="og-grid-fade">
			<rect width="1200" height="630" fill="url(#og-grid-mask)"/>
		</mask>
	</defs>

	<rect width="1200" height="630" fill="#09090b"/>
	<rect width="1200" height="630" fill="url(#og-grid)" mask="url(#og-grid-fade)"/>
	<rect width="1200" height="630" fill="url(#og-bg-1)"/>
	<rect width="1200" height="630" fill="url(#og-bg-2)"/>
	<rect width="1200" height="630" fill="url(#og-bg-3)"/>

	<g transform="translate(96, 188)">
		<rect x="-1" y="-1" width="146" height="146" rx="36" fill="none" stroke="#27272a" stroke-width="1" opacity="0.6"/>
		<g transform="scale(2.25)">
			<rect width="64" height="64" rx="14" fill="url(#og-icon-grad)" mask="url(#og-cut)"/>
		</g>
	</g>

	<g transform="translate(280, 196)">
		<text x="0" y="0" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" font-weight="500" letter-spacing="0.18em" fill="#a1a1aa">VIXELY</text>
		<text x="0" y="80" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#fafafa">Edit Videos, Images</text>
		<text x="0" y="166" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#fafafa">&amp; GIFs in your browser</text>
	</g>

	<g transform="translate(96, 510)">
		<g transform="translate(0, 0)">
			<circle cx="9" cy="9" r="5" fill="#34d399"/>
			<text x="24" y="14" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#a1a1aa">100% client-side</text>
		</g>
		<g transform="translate(240, 0)">
			<circle cx="9" cy="9" r="5" fill="#60a5fa"/>
			<text x="24" y="14" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#a1a1aa">No uploads</text>
		</g>
		<g transform="translate(420, 0)">
			<circle cx="9" cy="9" r="5" fill="#a78bfa"/>
			<text x="24" y="14" font-family="'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#a1a1aa">Free forever</text>
		</g>
	</g>

	<text x="1104" y="566" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, 'SF Mono', monospace" font-size="20" fill="#71717a">vixely.app</text>
</svg>
