# Files named by their content (Vite's hashed assets) never change; everything else, the pages
# first, is checked again at each visit, so a new version is seen as soon as it is deployed.
map $uri $cache_control {
    ~^/assets/   "public, max-age=31536000, immutable";
    default      "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirects keep the visitor's own scheme and host: Railway's proxy speaks HTTPS, nginx doesn't.
    absolute_redirect off;

    # ── Security headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "interest-cohort=()" always;
    add_header Cache-Control $cache_control always;

    # ── Required for SharedArrayBuffer (threads in WebAssembly) ──
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # ── Addresses of the first Vixely, now editors of their own ──
    location = /tools/video { return 301 /video; }
    location = /tools/image { return 301 /image; }
    location = /tools/gif { return 301 /gif; }

    # ── Pages with their own head (scripts/prerender.ts), then the app for everything else ──
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # ── Health check ──
    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
