[package]
name = "vixely-truehd"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Dolby TrueHD decoding for Vixely, loaded for the films that have it. Compiled to WebAssembly."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
truehd = "0.7"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue", "--enable-simd"]
