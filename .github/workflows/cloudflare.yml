name: Deploy to Cloudflare

# main is production (vixely.app), v1 is preprod (vixely-preprod.xantoom.workers.dev).
# Needs the repository secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers").
on:
    push:
        branches: [main]
        paths-ignore: ['**.md', 'docs/**', 'LICENSE']
    workflow_dispatch:

permissions:
    contents: read

# One deployment at a time per branch; the latest push wins once the running one is done.
concurrency:
    group: cloudflare-${{ github.ref }}
    cancel-in-progress: false

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - uses: Swatinem/rust-cache@v2

            - name: Install wasm-pack
              run: curl -sSfL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz | sudo tar xz --strip-components=1 -C /usr/local/bin wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # WebAssembly, routes, Vite, sitemap and prerendered pages (see package.json).
            - name: Build
              run: bun run build

            - name: Prepare dist for Cloudflare
              run: printf '.vite\n' > dist/.assetsignore

            # Workers serves no single file over 25 MiB, and at most 20,000 files (Free plan).
            - name: Check the asset limits
              run: |
                  big=$(find dist -type f -size +26214400c)
                  if [ -n "$big" ]; then echo "::error::Over the 25 MiB Workers asset limit:"; ls -l $big; exit 1; fi
                  count=$(find dist -type f ! -path 'dist/.vite/*' | wc -l)
                  echo "$count files, largest:"; find dist -type f -printf '%s %p\n' | sort -nr | head -5
                  if [ "$count" -gt 20000 ]; then echo "::error::$count files, over the 20,000 limit"; exit 1; fi

            - name: Deploy
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: bunx wrangler@4 deploy
