name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    deploy:
        name: Build image and deploy to Railway
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Build the runtime image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  # A single Bun version argument, changed in one place on a rollback.
                  build-args: BUN_VERSION=1.4.0
                  load: true
                  tags: vixely:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Smoke-test the image before it ships
              run: |
                  docker run -d --name vixely -p 8080:8080 vixely:${{ github.sha }}
                  for attempt in $(seq 1 30); do
                    if curl -fsS http://127.0.0.1:8080/ > /dev/null; then break; fi
                    sleep 1
                  done
                  curl -fsS http://127.0.0.1:8080/ | grep -q "Vixely" || { docker logs vixely; exit 1; }
                  # An unknown path must fall through to the SPA shell, not 404.
                  curl -fsS http://127.0.0.1:8080/tools/image > /dev/null
                  # And the security headers must actually be present.
                  curl -fsSI http://127.0.0.1:8080/ | grep -qi "content-security-policy" || exit 1
                  docker rm -f vixely

            - name: Deploy
              uses: bervProject/railway-deploy@main
              env:
                  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
              with:
                  service: ${{ vars.RAILWAY_SERVICE }}
