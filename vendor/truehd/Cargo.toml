[package]
edition = "2024"
rust-version = "1.88.0"
name = "truehd"
version = "0.7.2"
authors = ["Rainbaby"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Research implementation of Dolby TrueHD parser/decoder"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/truehdd/truehdd/tree/main/truehd"
resolver = "2"

[features]
evo-protection = [
    "dep:hmac",
    "dep:sha2",
]
perf = []

[lib]
name = "truehd"
crate-type = ["lib"]
path = "src/lib.rs"

[dependencies.anyhow]
version = "1.0.104"

[dependencies.bitstream-io]
version = "4.10.0"

[dependencies.hmac]
version = "0.12.1"
optional = true

[dependencies.log]
version = "0.4.33"

[dependencies.sha2]
version = "0.10.9"
optional = true

[dependencies.thiserror]
version = "2.0.19"
