[workspace]
resolver = "3"
members = ["vixely-core", "vixely-image", "vixely-audio", "vixely-gif", "vixely-subs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# gifski patched to run without threads in WebAssembly: see vendor/gifski/VIXELY.md.
[patch.crates-io]
gifski = { path = "vendor/gifski" }
