[workspace]
resolver = "3"
members = ["vixely-core", "vixely-image", "vixely-audio", "vixely-gif", "vixely-subs", "vixely-truehd"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# gifski patched to run without threads in WebAssembly: see vendor/gifski/VIXELY.md.
# truehd patched to compile in seconds and little memory: see vendor/truehd/VIXELY.md.
[patch.crates-io]
gifski = { path = "vendor/gifski" }
truehd = { path = "vendor/truehd" }

# For tests: what the shipped WebAssembly needs (link-time optimisation) takes far longer than the
# tests themselves.
[profile.ci]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
