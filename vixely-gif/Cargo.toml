[package]
name = "vixely-gif"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Animated images for Vixely: GIF, APNG and WebP decoding, gifski encoding. Compiled to WebAssembly."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# The best GIF encoder: cross-frame palettes and temporal dithering. Patched to run without
# threads in WebAssembly (vendor/gifski). `gifsicle` brings lossy LZW compression.
gifski = { version = "1.34", default-features = false, features = ["gifsicle"] }
imgref = "1.11"
rgb = "0.8"
# Decodes GIF, APNG and animated WebP into full frames, disposal and blending applied.
image = { version = "0.25", default-features = false, features = ["gif", "png", "webp"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue", "--enable-simd"]
